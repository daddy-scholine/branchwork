<script>
/* Branchwork local mode: stands in for claude.ai's storage so the app runs on its own, saving to this device. */
(function () {
  window.BW_LOCAL = true;
  const KEY = "bwdb:";
  const read = p => { try { const v = localStorage.getItem(KEY + p); return v ? JSON.parse(v) : null; } catch { return null; } };
  const write = (p, v) => { try { if (v == null) localStorage.removeItem(KEY + p); else localStorage.setItem(KEY + p, JSON.stringify(v)); return true; } catch (e) { return e; } };
  const listeners = new Set();
  const notify = () => listeners.forEach(fn => { try { fn(); } catch {} });
  const meta = { fromCache: false, hasPendingWrites: false };
  const snap = (path) => { const d = read(path); const id = path.split("/").pop(); return { id, exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined, metadata: meta }; };
  const merge = (a, b) => { const o = { ...(a || {}) }; for (const k in b) { const v = b[k]; o[k] = v && typeof v === "object" && !Array.isArray(v) ? merge(o[k], v) : v; } return o; };
  const err = (code, message) => Object.assign(new Error(message), { code, message });
  const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snap(path),
      set: async d => { const r = write(path, d); if (r !== true) throw err("quota_exceeded", "This device's storage is full"); notify(); },
      update: async d => { const cur = read(path); if (!cur) throw err("invalid_argument", "Document does not exist"); const r = write(path, merge(cur, d)); if (r !== true) throw err("quota_exceeded", "This device's storage is full"); notify(); },
      delete: async () => { write(path, null); notify(); },
      onSnapshot(next) { let last; const fn = () => { const s = snap(path); const k = JSON.stringify(s.exists ? s.data() : null); if (k !== last) { last = k; next(s); } }; listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection: sub => collRef(path + "/" + sub),
    };
  }
  function query(path, opts) {
    const run = () => { const pre = KEY + path + "/"; const depth = path.split("/").length + 1; const docs = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre) && k.slice(KEY.length).split("/").length === depth) docs.push(snap(k.slice(KEY.length))); } } catch {}
      if (opts.order) { const [f, dir] = opts.order; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x > y ? 1 : x < y ? -1 : 0) * (dir === "desc" ? -1 : 1); }); }
      const out = opts.limit ? docs.slice(0, opts.limit) : docs;
      return { docs: out, size: out.length, empty: !out.length, docChanges: () => [], metadata: meta }; };
    return {
      where: () => query(path, opts),
      orderBy: (f, dir) => query(path, { ...opts, order: [f, dir || "asc"] }),
      limit: n => query(path, { ...opts, limit: n }),
      get: async () => run(),
      onSnapshot(next) { let last; const fn = () => { const r = run(); const k = JSON.stringify(r.docs.map(d => [d.id, d.data()])); if (k !== last) { last = k; next(r); } }; listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
    };
  }
  function collRef(path) { const q = query(path, {}); return { ...q, path, doc: id => docRef(path + "/" + (id || gid())), add: async d => { const r = docRef(path + "/" + gid()); await r.set(d); return r; } }; }
  const db = Object.freeze({ doc: docRef, collection: collRef });
  const ME = "me";
  const user = Object.freeze({
    id: async () => ME, isOwner: async () => true, canEdit: async () => true, can: async () => true,
    me: async () => ({ id: ME, name: "You", avatarUrl: "", color: "", email: null, isOwner: true, canEdit: true }),
    profiles: async ids => { const o = {}; [].concat(ids).forEach(i => o[i] = { id: i, name: i === ME ? (localStorage.getItem("bw:name") ? JSON.parse(localStorage.getItem("bw:name")) : "You") : "", avatarUrl: "", color: "", email: null, isMe: i === ME, guest: false }); return o; },
    name: async () => "You", avatarUrl: async () => null, search: async () => [],
  });
  const assets = Object.freeze({
    async upload(blob) {
      if (!/^image\//.test(blob.type)) throw err("unsupported_type", "Only photos can be saved on this device");
      const url = URL.createObjectURL(blob); const img = new Image();
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
      const s = Math.min(1, 1000 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const data = c.toDataURL("image/jpeg", 0.72); return { id: gid(), url: data, sizeBytes: data.length, contentType: "image/jpeg" };
    },
    list: async () => ({ assets: [], usage: { files: 0, bytes: 0, maxFiles: 0, maxBytes: 0 } }), delete: async () => ({ deleted: true }),
  });
  const downloads = Object.freeze({
    async save({ filename, data }) { const blob = data instanceof Blob ? data : new Blob([data], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return { status: "saved" }; },
  });
  const caps = { db, user, assets, downloads };
  window.claude = Object.freeze({ use: name => Promise.resolve(caps[name] || null) });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.BW_INSTALL = e; });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();

</script>

<title>Branchwork</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: app shell. Wide screens get a left rail; phones get a bottom tab bar. Content column caps at 1000px. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface2:#E8ECE4; --line:#D5DCD0; --fg:#17201A; --muted:#5C695F;
  --accent:#2E7748; --accent-ink:#FFFFFF; --cell0:#E2E8DE; --danger:#B13E2D; --warn:#A86E12;
  --d1:#2E7748; --d2:#4357C7; --d3:#A86E12; --d4:#B53B70; --d5:#1A7F7F; --d6:#A44D29;
  --shadow:0 10px 30px rgba(20,35,25,.14); --grid:#E1E7DC; --grid-dot:#C3CCBD;
  --tissue:#F7E6E3; --wall:#D69D99; --mucus:#CDBF6A; --mucus-old:#8F7E2A; --air:#EAF5FB; --airflow:#3C93C8; --alv-on:#EC8496; --alv-off:#D6CFCB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E19; --surface2:#212923; --line:#2D3830; --fg:#E5EBE4; --muted:#97A59A;
  --accent:#5BBA7C; --accent-ink:#0B180F; --cell0:#202822; --danger:#E46F5C; --warn:#E2A84B;
  --d1:#5BBA7C; --d2:#8492F2; --d3:#E2A84B; --d4:#E67AA8; --d5:#4CC2C2; --d6:#E38B5F;
  --shadow:0 10px 30px rgba(0,0,0,.5); --grid:#222C25; --grid-dot:#3A463E;
  --tissue:#2B2022; --wall:#8E5B5B; --mucus:#9C9248; --mucus-old:#6A5F1E; --air:#1F3340; --airflow:#7CC4EE; --alv-on:#F08FA2; --alv-off:#4A4245; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E19; --surface2:#212923; --line:#2D3830; --fg:#E5EBE4; --muted:#97A59A;
  --accent:#5BBA7C; --accent-ink:#0B180F; --cell0:#202822; --danger:#E46F5C; --warn:#E2A84B;
  --d1:#5BBA7C; --d2:#8492F2; --d3:#E2A84B; --d4:#E67AA8; --d5:#4CC2C2; --d6:#E38B5F;
  --shadow:0 10px 30px rgba(0,0,0,.5); --grid:#222C25; --grid-dot:#3A463E;
  --tissue:#2B2022; --wall:#8E5B5B; --mucus:#9C9248; --mucus-old:#6A5F1E; --air:#1F3340; --airflow:#7CC4EE; --alv-on:#F08FA2; --alv-off:#4A4245; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.02rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.shell{display:flex;min-height:100%}
.rail{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}
.col{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 8px;border-radius:8px;min-width:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
@media (min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:210px;flex:none;padding:22px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface)}
  .rail .brand{font-family:var(--f-display);font-size:1.35rem;font-weight:700;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
  .rail .tab{flex-direction:row;font-size:.95rem;gap:10px;padding:9px 10px;justify-content:flex-start}
  .main{padding-block:28px 40px}
}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar .sub{color:var(--muted);font-size:.9rem}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ex{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.chip.ok{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.banner{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));font-size:.9rem}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:46ch;margin:0;color:var(--muted)}

/* tree */
.tree{display:flex;flex-direction:column}
.dom{border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dom + .dom{margin-top:12px}
.dom-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 12px;border-left:5px solid var(--dc)}
.dom-head .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:1;min-width:0;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px 7px calc(10px + var(--depth) * 20px);border-top:1px solid var(--line);position:relative}
.row::before{content:"";position:absolute;left:calc(var(--depth) * 20px - 2px);top:0;bottom:0;width:1px;background:var(--line)}
.row.done .rt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.rt{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.rt b{font-weight:600;overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.meta:empty{display:none}
.chev{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);border-radius:6px;flex:none}
.chev svg{width:14px;height:14px;transition:transform .15s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev.blank{visibility:hidden}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.cb svg{width:14px;height:14px;opacity:0}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.cb[aria-checked="true"] svg{opacity:1}
.cb[aria-checked="mixed"]{border-color:var(--accent);background:linear-gradient(var(--accent),var(--accent)) center/10px 2px no-repeat}
.ring{flex:none}
.ring text{font-family:var(--f-mono);font-size:9px;fill:var(--fg)}
.row-actions{display:flex;gap:0;flex:none}
@media (max-width:520px){ .row{padding-left:calc(6px + var(--depth) * 14px)} .row::before{left:calc(var(--depth) * 14px - 2px)} }

/* map */
.mapwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.mapwrap svg text{font-family:var(--f-body);font-size:12px;fill:var(--fg)}
.mapwrap svg .mnode{cursor:pointer}

/* today */
.group{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trow .rt small{white-space:normal}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none;display:inline-block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{border-radius:18px}}
.field{display:flex;flex-direction:column;gap:5px}
.field input[type=text],.field input[type=date],.field input[type=number],.field input[type=datetime-local],.field input[type=url],.field textarea,.field select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow > *{flex:1 1 160px;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.sheet-actions > div{display:flex;gap:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}

/* focus */
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.focus .col{max-width:760px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.crumbs span + span::before{content:"›";margin-right:6px}
.fhero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fhero h1{font-size:2rem}
.next{border:2px solid var(--accent);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-mono);font-size:2.6rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* dashboard */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:3px}
.hm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hm-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hm-ctrl select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.cell{height:clamp(40px,10vw,62px);max-width:100%;border-radius:8px;background:var(--cell0);display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 6px;font-size:.72rem;font-family:var(--f-mono);color:var(--muted);position:relative}
.cell.l1{background:color-mix(in srgb,var(--accent) 28%,var(--cell0))}
.cell.l2{background:color-mix(in srgb,var(--accent) 52%,var(--cell0));color:var(--fg)}
.cell.l3{background:color-mix(in srgb,var(--accent) 76%,var(--cell0));color:var(--accent-ink)}
.cell.l4{background:var(--accent);color:var(--accent-ink)}
.cell.today{outline:2px solid var(--fg);outline-offset:1px}
.cell.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.cell.pad{background:transparent}
.cell .n{position:absolute;right:6px;bottom:4px;font-weight:700}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.year{overflow-x:auto;padding-bottom:4px}
.year .yg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;width:max-content}
.year .yc{border-radius:2px;background:var(--cell0)}
